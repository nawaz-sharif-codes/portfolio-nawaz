  <!-- Monogram & Header -->
  <rect x="72" y="72" width="44" height="44" rx="6" fill="#141413" />
  <text x="94" y="101" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#f0eee6" text-anchor="middle">NS</text>
  
  <text x="132" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#141413">NAWAZ SHARIF</text>
  <text x="1128" y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="600" letter-spacing="1" fill="#87867f" text-anchor="end">BACKEND &amp; SYSTEMS ENGINEER</text>

